<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="По пути — чат разработки">
  <title>По пути — чат разработки</title>
  <desc>Ветвление маршрута: тот же путь, что на иконке приложения, но здесь он разделяется — место, где решают, куда ехать дальше.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2E221B"/>
      <stop offset="1" stop-color="#17110E"/>
    </linearGradient>
  </defs>

  <!-- Фон во всё поле, без скруглений: Telegram обрежет аватарку по кругу
       сам, и собственные углы на круглой маске дали бы заметные зазубрины.
       Фон тёмный — это единственное, что отличает чат разработки от самого
       приложения в списке диалогов на 40 пикселях. Знак, цвет и подпись
       там не читаются, разница светлого и тёмного пятна читается всегда. -->
  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- Знак — то же, что на иконке приложения: линия между точками. Но линия
       ветвится, и это ровно то, чем занят этот чат: решают, куда пойдёт
       следующая версия. Линия сплошная, а не пунктирная, как в приложении:
       на тёмном фоне пунктир той же толщины рассыпается в точки. -->
  <g fill="none" stroke="#FF9A76" stroke-width="54" stroke-linecap="round">
    <!-- Основная ветка. -->
    <path d="M 348 812 L 348 212"/>
    <!-- Отведение: контрольная точка стоит на самой линии, поэтому
         ответвление сначала идёт вдоль неё и только потом уходит в сторону —
         так же построен поворот маршрута на иконке приложения. -->
    <path d="M 348 624 Q 348 392 692 392"/>
  </g>

  <!-- Узлы: кольцо с тёмной серединой — та же фигура, что точка отправления
       на иконке приложения, только наоборот по цвету. Серединой узел
       «надевается» на линию и перекрывает её, поэтому стык линии и узла не
       виден даже при сильном уменьшении. -->
  <g>
    <circle cx="348" cy="812" r="80" fill="#FF9A76"/>
    <circle cx="348" cy="812" r="33" fill="#1C1511"/>

    <circle cx="348" cy="212" r="80" fill="#FF9A76"/>
    <circle cx="348" cy="212" r="33" fill="#1C1511"/>

    <circle cx="692" cy="392" r="80" fill="#FF9A76"/>
    <circle cx="692" cy="392" r="33" fill="#1C1511"/>
  </g>
</svg>
