services:
  postgres:
    image: postgres:16-alpine
    container_name: vk-rideshare-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rideshare}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rideshare}
      POSTGRES_DB: ${POSTGRES_DB:-vk_rideshare}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - vk-rideshare-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rideshare} -d ${POSTGRES_DB:-vk_rideshare}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vk-rideshare-pgdata:
