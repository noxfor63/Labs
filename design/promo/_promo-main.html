<!doctype html>
<meta charset="utf-8">
<style>
  :root {
    --brand-deep: #A33A22;
    --brand: #E2613C;
    --brand-light: #FFA76B;
  }
  html, body { margin: 0; padding: 0; }
  .card {
    width: 1080px; height: 1080px;
    background: linear-gradient(135deg, var(--brand-deep) 0%, var(--brand) 55%, var(--brand-light) 100%);
    font-family: 'Liberation Sans', 'DejaVu Sans', sans-serif;
    color: #fff;
    position: relative;
    overflow: hidden;
    box-sizing: border-box;
    padding: 72px 72px 0;
  }
  .text { max-width: 560px; }
  h1 { margin: 0; font-size: 104px; line-height: 0.98; letter-spacing: -2px; }
  .sub { margin-top: 18px; font-size: 38px; opacity: 0.92; }
  .cities { margin-top: 10px; font-size: 32px; opacity: 0.78; }
  .points { margin-top: 40px; font-size: 30px; line-height: 1.6; opacity: 0.95; }
  .points div { margin-bottom: 10px; }
  .phone {
    position: absolute;
    right: 56px; bottom: -90px;
    width: 390px;
    border-radius: 36px;
    overflow: hidden;
    box-shadow: 0 40px 90px rgba(0,0,0,0.35);
    border: 10px solid rgba(255,255,255,0.9);
    background: #fff;
  }
  .phone img { display: block; width: 100%; }
  .link {
    position: absolute; left: 72px; bottom: 72px;
    font-size: 34px; font-weight: bold;
    background: rgba(255,255,255,0.16);
    padding: 18px 28px; border-radius: 18px;
  }
</style>
<div class="card">
  <div class="text">
    <h1>По пути</h1>
    <div class="sub">Поиск попутчиков</div>
    <div class="cities">Оренбург · Соль-Илецк · Акбулак</div>
    <div class="points">
      <div>Фильтры по дню, цене и числу мест</div>
      <div>Отклик в одно касание</div>
      <div>Связь в сообщениях или звонком</div>
      <div>Рейтинг и отзывы после поездки</div>
    </div>
  </div>
  <div class="link">vk.com/app54794463</div>
  <div class="phone"><img src="../store/screen-1-search.png"></div>
</div>
