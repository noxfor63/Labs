<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1590 400" width="1590" height="400" role="img" aria-label="По пути — поиск попутчиков — Оренбург, Соль-Илецк, Акбулак">
  <title>По пути</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A33A22"/>
      <stop offset="0.55" stop-color="#E2613C"/>
      <stop offset="1" stop-color="#FFA76B"/>
    </linearGradient>
  </defs>

  <rect width="1590" height="400" fill="url(#bg)"/>

  <!-- Текст держится в левой половине: площадка может обрезать обложку
       по краям, и название не должно попасть под обрез. -->
  <g font-family="Liberation Sans, DejaVu Sans, sans-serif" fill="#FFFFFF">
    <text x="96" y="186" font-size="104" font-weight="bold" letter-spacing="-2">По пути</text>
    <text x="100" y="238" font-size="40" fill-opacity="0.95">Поиск попутчиков</text>
    <text x="100" y="292" font-size="34" fill-opacity="0.78">Оренбург · Соль-Илецк · Акбулак</text>
  </g>

  <!-- Тот же знак, что на аватарке, в уменьшенном виде: обложка и иконка
       должны читаться как одно приложение. -->
  <g transform="translate(1150, 14) scale(0.36)">
    <path d="M 300 760 Q 300 440 700 440"
          fill="none" stroke="#FFFFFF" stroke-opacity="0.92"
          stroke-width="42" stroke-linecap="round" stroke-dasharray="4 96"/>
    <circle cx="300" cy="760" r="64" fill="#FFFFFF"/>
    <circle cx="300" cy="760" r="27" fill="#E2613C"/>
    <path d="M 700 440 C 636 360 608 330 608 296 A 92 92 0 1 1 792 296 C 792 330 764 360 700 440 Z"
          fill="#FFFFFF"/>
    <circle cx="700" cy="293" r="39" fill="#E2613C"/>
  </g>
</svg>
