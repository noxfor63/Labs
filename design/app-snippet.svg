<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 630" width="1120" height="630" role="img" aria-label="Поиск попутчиков — Оренбург, Соль-Илецк, Акбулак">
  <title>Поиск попутчиков</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B45C9"/>
      <stop offset="0.55" stop-color="#2F7BF0"/>
      <stop offset="1" stop-color="#24CBE6"/>
    </linearGradient>
  </defs>

  <rect width="1120" height="630" fill="url(#bg)"/>

  <!-- Знак крупно слева: в ленте сниппет виден мельком, и первым должен
       читаться образ, а не текст. -->
  <g transform="translate(60, 110) scale(0.40)">
    <path d="M 300 760 Q 300 440 700 440"
          fill="none" stroke="#FFFFFF" stroke-opacity="0.92"
          stroke-width="42" stroke-linecap="round" stroke-dasharray="4 96"/>
    <circle cx="300" cy="760" r="64" fill="#FFFFFF"/>
    <circle cx="300" cy="760" r="27" fill="#2F7BF0"/>
    <path d="M 700 440 C 636 360 608 330 608 296 A 92 92 0 1 1 792 296 C 792 330 764 360 700 440 Z"
          fill="#FFFFFF"/>
    <circle cx="700" cy="293" r="39" fill="#2F7BF0"/>
  </g>

  <g font-family="Liberation Sans, DejaVu Sans, sans-serif" fill="#FFFFFF">
    <text x="470" y="290" font-size="76" font-weight="bold" letter-spacing="-1">Поиск</text>
    <text x="470" y="372" font-size="76" font-weight="bold" letter-spacing="-1">попутчиков</text>
    <text x="474" y="436" font-size="31" fill-opacity="0.82">Оренбург · Соль-Илецк · Акбулак</text>
  </g>
</svg>
