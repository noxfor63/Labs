<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Поиск попутчиков">
  <title>Поиск попутчиков</title>
  <desc>Маршрут из точки отправления к метке назначения.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B45C9"/>
      <stop offset="0.55" stop-color="#2F7BF0"/>
      <stop offset="1" stop-color="#24CBE6"/>
    </linearGradient>
  </defs>

  <!-- Фон во всё поле: платформа сама обрежет его под нужную форму,
       поэтому скруглений здесь нет — иначе на круглой маске вылезли бы углы. -->
  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- Маршрут: пунктир от точки отправления к метке назначения.
       Пунктир, а не сплошная линия, — чтобы мелкий размер не слипался
       в одно пятно и читалось движение. Маршрут доводится ровно до
       острия метки: метка рисуется поверх и перекрывает последнюю точку,
       поэтому линия и метка читаются как одно целое, а не как два знака. -->
  <path d="M 300 760 Q 300 440 700 440"
        fill="none"
        stroke="#FFFFFF"
        stroke-opacity="0.92"
        stroke-width="42"
        stroke-linecap="round"
        stroke-dasharray="4 96"/>

  <!-- Точка отправления. -->
  <circle cx="300" cy="760" r="64" fill="#FFFFFF"/>
  <circle cx="300" cy="760" r="27" fill="#2F7BF0"/>

  <!-- Метка назначения: остриё стоит ровно на конце маршрута. -->
  <path d="M 700 440 C 636 360 608 330 608 296 A 92 92 0 1 1 792 296 C 792 330 764 360 700 440 Z"
        fill="#FFFFFF"/>
  <circle cx="700" cy="293" r="39" fill="#2F7BF0"/>
</svg>
